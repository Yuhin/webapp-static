<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ёblist — Таблица</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;--surface:#111118;--surface-2:#171720;--border:#22222e;
      --text:#f5f5ff;--muted:#9a9ab0;--accent:#a78fea;--danger:#ff6b9d;--success:#51cf9d;--radius:12px
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;padding:12px;font-size:16px;line-height:1.5}
    .row-count{color:var(--muted);font-size:13px;margin-bottom:8px;text-align:center}
    table{width:100%;min-width:320px;border-collapse:collapse}
    th{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
      color:var(--muted);padding:6px 4px 4px;border-bottom:1px solid var(--border)}
    th input{width:100%;padding:4px 6px;background:var(--surface-2);border:1px solid var(--border);
      border-radius:4px;font-size:13px;color:var(--text);text-align:center}
    td{padding:2px}
    td input{width:100%;padding:6px 8px;background:var(--surface-2);border:1px solid var(--border);
      border-radius:4px;font-size:15px;color:var(--text);text-align:center}
    .btn{padding:10px 14px;border-radius:var(--radius);border:none;font-size:13px;font-weight:600;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0}
    .btn:active{transform:scale(.97)}
    .btn-success{background:var(--success);color:#000}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-accent{background:var(--accent);color:#000}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .btn-full{width:100%}
    .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
      background:var(--accent);color:#000;padding:8px 16px;border-radius:20px;
      font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
    .toast.show{opacity:1}
    .voice-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:12px;text-align:center;margin:12px 0}
    .voice-btn{width:50px;height:50px;border-radius:50%;border:none;background:var(--accent);color:#000;
      font-size:20px;cursor:pointer;margin-bottom:8px}
  </style>
</head>
<body>
  <div class="row-count" id="rc">Строки: 0 | Колонок: 0</div>
  <table id="tbl">
    <thead id="hdr"></thead>
    <tbody id="body"></tbody>
  </table>
  <div style="display:flex;gap:6px;margin:8px 0">
    <button class="btn btn-ghost btn-full" id="ac">➕ Столбец</button>
    <button class="btn btn-ghost btn-full" id="ar">➕ Строка</button>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-success btn-full" id="sb">💾 Сохранить</button>
    <button class="btn btn-danger btn-full" id="cl">🧹 Очистить строки</button>
  </div>
  <div class="voice-area">
    <div class="voice-btn" id="vb">🎙</div>
    <div style="font-size:12px;color:var(--muted)" id="vh">Нажми → распознавание</div>
  </div>
  <button class="btn btn-accent btn-full" id="dl">📥 Скачать xlsx</button>
  <div class="toast" id="toast"></div>

  <!-- TG Web App JS -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    "use strict";
    // Минимальный tg access — get once, use everywhere
    var tg = null; var chatId = 360926813;
    try { tg = window.Telegram && window.Telegram.WebApp; } catch(e){}
    try { tg && tg.ready && tg.ready(); } catch(e){}
    // get tg from tg.js after load (race)
    var tgReadyTry = 0;
    function getTG() {
      try { if (!tg && window.Telegram && window.Telegram.WebApp) tg = window.Telegram.WebApp; } catch(e){}
      try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.chat && tg.initDataUnsafe.chat.id) chatId = String(tg.initDataUnsafe.chat.id); } catch(e){}
      return tg;
    }
    var tgInt = setInterval(function(){ if(getTG()){ /* tg ready */ } }, 200);
    setTimeout(function(){ try{ clearInterval(tgInt); }catch(e){} }, 5000);

    var columns = ["Стол","Стул","Кол-во"];
    function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); }, 2000); }

    function updateRC(){
      var n = document.querySelectorAll("#body tr").length, k = columns.length;
      document.getElementById("rc").textContent = "Строки: "+n+" | Колонок: "+k;
    }
    function renderHdr(){
      var h = document.getElementById("hdr"); h.innerHTML = "";
      columns.forEach(function(cn,i){
        var th = document.createElement("th"); th.innerHTML = '<input type="text" value="'+cn+'" onchange="columns['+i+']=this.value">';
        h.appendChild(th);
      });
      var th2 = document.createElement("th"); th2.innerHTML = '<span style="font-size:10px;color:var(--muted)">Строки</span>'; h.appendChild(th2);
      updateRC();
    }
    function addRow(){
      var b = document.getElementById("body"), tr = document.createElement("tr");
      columns.forEach(function(_,i){
        var td = document.createElement("td");
        td.innerHTML = '<input type="text" onchange="window._v[\''+b.childElementCount+'_'+i+'\']=this.value" value="">';
        tr.appendChild(td);
      });
      var tdD = document.createElement("td"); tdD.style.width="36px";
      tdD.innerHTML = '<button class="btn btn-ghost" style="padding:2px 6px;font-size:11px" onclick="this.closest(\"tr\").remove();updateRC()">✕</button>';
      tr.appendChild(tdD);
      b.appendChild(tr);
      if(!window._v) window._v={};
      updateRC();
    }
    renderHdr(); addRow();

    // Сохранить → tg.MainButton.sendData (работает в menu button context)
    document.getElementById("sb").addEventListener("click", function(){
      var rows=[];
      document.querySelectorAll("#body tr").forEach(function(tr){
        var vals = [];
        tr.querySelectorAll("input[type=text]").forEach(function(i){ vals.push(i.value); });
        if (vals.some(function(v){return v!==undefined&&v!==null&&v!=="";})) rows.push(vals);
      });
      if(!rows.length){ toast("Нечего сохранять"); return; }
      var payload = JSON.stringify({ action:"add_rows", chat_id:chatId, columns:columns, rows:rows });
      // Всегда пытаемся MainButton.sendData (работает в menu_button)
      var t = getTG();
      if(!t && window.Telegram && window.Telegram.WebApp) t = window.Telegram.WebApp;
      if(t && t.MainButton && typeof t.MainButton.sendData === "function"){
        try { t.MainButton.sendData(payload); toast("✅ Отправлено!"); return; } catch(e){ console.warn("mb.sendData err:",e); }
      }
      // fallback: tg.sendData (KeyboardButton)
      if(t && typeof t.sendData === "function"){
        try { t.sendData(payload); toast("✅ Отправлено!"); return; } catch(e){}
      }
      toast("⚠️ Вне Telegram — откройте в чате с ботом");
      console.log("PAYLOAD:", payload);
    });

    // add col / row / clear / download
    document.getElementById("ac").addEventListener("click", function(){ columns.push(prompt("Название колонки:") || ("Колонка "+(columns.length+1))); renderHdr(); });
    document.getElementById("ar").addEventListener("click", function(){ addRow(); });
    document.getElementById("cl").addEventListener("click", function(){ document.getElementById("body").innerHTML=""; addRow(); updateRC(); toast("Очищено"); });
    document.getElementById("dl").addEventListener("click", function(){
      var p = JSON.stringify({ action:"download", chat_id:chatId });
      var t = getTG();
      if(!t && window.Telegram && window.Telegram.WebApp) t = window.Telegram.WebApp;
      if(t && t.MainButton && typeof t.MainButton.sendData === "function"){ try{t.MainButton.sendData(p);} catch(e){} toast("📥 Отправлено"); }
      else if(t && typeof t.sendData==="function"){ try{t.sendData(p);} catch(e){} toast("📥 Отправлено"); }
      else toast("📥 В чате: /download");
    });

    // 🎙 Web Speech (Desktop) → whisper fallback (iOS)
    var rec=null;
    document.getElementById("vb").addEventListener("click", function(){
      if(rec){ try{rec.stop();}catch(e){} rec=null; this.textContent="🎙"; document.getElementById("vh").textContent="Слушаю..."; return; }
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){ toast("🎙 Web Speech недоступен · voice→whisper в Telegram"); document.getElementById("vh").textContent="Запишите voice message → бот → whisper"; return; }
      try{
        rec = new SR(); rec.lang="ru-RU"; rec.interimResults=false; rec.maxAlternatives=1;
        rec.onresult = function(e){
          var t = e.results[0][0].transcript.trim();
          document.getElementById("vh").textContent="Распознано: "+t;
          toast("✅ "+t);
          var parts = t.split(",").map(function(s){return s.trim();}).filter(Boolean);
          var inputs = document.querySelector("#body tr") && document.querySelector("#body tr").querySelectorAll("input[type=text]");
          if(inputs && inputs.length){ parts.forEach(function(v,i){ if(inputs[i]) inputs[i].value=v; }); }
        };
        rec.onerror = function(e){ toast("❌ "+e.error); };
        rec.onend = function(){ rec=null; this.textContent="🎙"; document.getElementById("vh").textContent="Нажми — распознавание"; };
        rec.start();
        this.textContent="⏹"; document.getElementById("vh").textContent="Слушаю...";
      }catch(e){
        toast("🚫 Web Speech error → voice→whisper");
        document.getElementById("vh").textContent="Запишите voice message → бот";
      }
    });
  </script>
</body>
</html>
