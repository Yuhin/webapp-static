<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ёblist — Dynamic Table</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --surface-2: #171720;
      --border: #22222e; --text: #f5f5ff; --text-secondary: #9a9ab0;
      --accent: #a78fea; --danger: #ff6b9d; --success: #51cf9d;
      --radius: 14px; --transition: all 0.2s cubic-bezier(0.25, 0.86, 0.32, 0.94);
    }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 16px;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .header .title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header .subtitle { font-size: 13px; color: var(--text-secondary); }
    .table-scroll {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
      overflow-x: auto; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
    table { width: 100%; min-width: 500px; border-collapse: collapse; }
    th { text-align: center; font-size: 11px; text-transform: uppercase;
         letter-spacing: 1px; color: var(--text-secondary); padding: 8px 4px 4px; border-bottom: 1px solid var(--border); }
    th input { width: 100%; padding: 6px 8px; background: var(--surface-2);
               border: 1px solid var(--border); border-radius: 6px; font-size: 13px; color: var(--text); text-align: center; }
    th input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    td { padding: 4px; }
    td input { width: 100%; padding: 8px 10px; background: var(--surface-2);
               border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--text); text-align: center; }
    td input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .col-actions { display: flex; gap: 6px; margin-top: 8px; }
    .btn { padding: 10px 14px; border-radius: var(--radius); border: none;
           font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition);
           display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active { transform: scale(0.97); }
    .btn-success { background: var(--success); color: #000; box-shadow: 0 4px 16px rgba(81,207,157,0.3); }
    .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 16px rgba(255,107,157,0.3); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-accent { background: var(--accent); color: #000; box-shadow: 0 4px 16px rgba(167,139,234,0.3); }
    .btn-full { width: 100%; }
    .voice-area {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; text-align: center; margin-bottom: 20px; transition: var(--transition);
    }
    .voice-area.recording { border-color: var(--danger); background: rgba(255,107,157,0.08); }
    .voice-btn { width: 64px; height: 64px; border-radius: 50%; border: none;
                 background: var(--accent); color: #000; font-size: 26px; cursor: pointer; margin-bottom: 12px;
                 display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(167,139,234,0.3);
                 transition: var(--transition); }
    .voice-btn.recording { background: var(--danger); color: #fff; animation: pulse-shrink 1s infinite; }
    @keyframes pulse-shrink { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .voice-hint { font-size: 13px; color: var(--text-secondary); min-height: 18px; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .row-count { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">Ёblist</div>
      <div class="subtitle" id="subtitle">Динамическая таблица</div>
    </div>
  </div>

  <!-- колонки можно переименовать и добавлять -->
  <div class="table-scroll">
    <div class="row-count" id="row-count">Строки: 0 | Колонок: 0</div>
    <table id="table">
      <thead><tr id="header-row"><!-- колонки генерятся JS --></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="col-actions">
      <button class="btn btn-ghost btn-full" id="add-col-btn" style="font-size:12px">➕ Добавить колонку</button>
      <button class="btn btn-danger btn-full" id="add-row-btn" style="font-size:12px">➕ Добавить строку</button>
    </div>
  </div>

  <!-- действия -->
  <div style="display:flex; gap:10px; margin-bottom:20px">
    <button class="btn btn-success btn-full" id="save-btn">💾 Сохранить в Telegram</button>
    <button class="btn btn-danger btn-full" id="clear-btn">🧹 Очистить строки</button>
  </div>

  <!-- микрофон: Web Speech API (Safari/Chrome) → tg.sendData -->
  <div class="voice-area" id="voice-area">
    <div class="voice-btn" id="voice-btn">🎙</div>
    <div class="voice-hint" id="voice-hint">Нажми — Web Speech распознаёт → tg.sendData в бот</div>
  </div>

  <button class="btn btn-accent btn-full" id="download-btn">📥 Скачать таблицу</button>

  <div class="toast" id="toast"></div>

  <!-- Telegram Web Apps JS API -->
  <script src="https://telegram.org/js/telegram-web-app.js?2"></script>
  <script>
    "use strict";

    // tg lazy init — iOS 26 WKWebView может давать window.Telegram.WebApp,
    // но отдельные методы (setParams, MainButton) частично broken →
    // ВСЕ tg-вызовы изолированы в try/catch, скрипт никогда не падает.
    let tg = null;
    let chatId = "360926813";
     let columns = [{ name: "Колонка 1" }, { name: "Колонка 2" }];
    let speechRec = null;
    let isRecording = false;

    function initTg() {
      try {
        tg = window.Telegram?.WebApp;
        if (!tg) return false;
        // iOS: ready() может бросить → catch. setHeaderColor — optional.
        try { if (typeof tg.ready === "function") tg.ready(); } catch(e) {}
        try { if (typeof tg.setHeaderColor === "function") tg.setHeaderColor("#0a0a0f"); } catch(e) {}
        // chat id extraction
        const chat = tg.initDataUnsafe?.chat;
        if (chat?.id) chatId = String(chat.id);
        else if (tg.initDataUnsafe?.user?.id) chatId = String(tg.initDataUnsafe.user.id);
        const name = tg.initDataUnsafe?.user?.first_name;
        if (name) { const sub = document.getElementById("subtitle"); if (sub) sub.textContent = `Привет, ${name}!`; }
        // MainButton config (iOS 26: защита через try/catch)
        try {
          if (tg.MainButton && typeof tg.MainButton.setParams === "function") {
            tg.MainButton.setParams({ text: "✨ Готово", color: "#a78fea", text_color: "#000" });
          }
        } catch(e) { console.warn("MainButton:", e); }
        return true;
      } catch(e) {
        console.warn("initTg error:", e);
        tg = null;
        return false;
      }
    }

    // Poll tg готовность — но НЕ более 5 сек (иначе iOS зависает)
    const tgPoll = setInterval(() => {
      if (initTg()) clearInterval(tgPoll);
    }, 100);
    setTimeout(() => clearInterval(tgPoll), 5000);

    const toast = document.getElementById("toast");
    const showToast = (msg) => {
      toast.textContent = msg; toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    };

    // --- колонки ---
    function updateRowCount() {
      const rows = document.querySelectorAll("#table-body tr").length;
      document.getElementById("row-count").textContent = `Строки: ${rows} | Колонок: ${columns.length}`;
    }

    function renderHeader() {
      const hr = document.getElementById("header-row");
      hr.innerHTML = "";
      columns.forEach((col, i) => {
        const th = document.createElement("th");
        th.innerHTML = `<input type="text" name="colname" value="${col.name}" data-idx="${i}" placeholder="Название колонки">
          <div style="margin-top:4px">
            <button class="btn" style="padding:2px 6px;font-size:10px;width:100%;background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border)" data-delete-col="${i}" title="Удалить колонку">✕</button>
          </div>`;
        hr.appendChild(th);
      });
      const thAdd = document.createElement("th");
      thAdd.innerHTML = `<div style="font-size:10px;color:var(--text-secondary)">Строки</div>`;
      hr.appendChild(thAdd);
      updateRowCount();
    }

    function addRow(data = []) {
      const body = document.getElementById("table-body");
      const tr = document.createElement("tr");
      for (let i = 0; i < columns.length; i++) {
        const td = document.createElement("td");
        td.innerHTML = `<input type="text" name="cell" data-cidx="${i}" value="${data[i] || ''}" placeholder="0">`;
        tr.appendChild(td);
      }
      const tdDel = document.createElement("td");
      tdDel.style.width = "40px";
      tdDel.innerHTML = `<button class="btn btn-ghost" style="padding:4px 8px;width:100%;font-size:12px" data-del-row="true">✕</button>`;
      tr.appendChild(tdDel);
      body.appendChild(tr);
    }

    function renderRows() {
      const body = document.getElementById("table-body");
      body.innerHTML = "";
      addRow();
      updateRowCount();
    }

    // --- ивенты колонок ---
    document.getElementById("header-row").addEventListener("input", (e) => {
      if (e.target.tagName === "INPUT" && e.target.name === "colname") {
        const idx = parseInt(e.target.dataset.idx);
        columns[idx].name = e.target.value;
      }
    });
    document.getElementById("header-row").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-delete-col]");
      if (btn) {
        const idx = parseInt(btn.dataset.deleteCol);
        columns.splice(idx, 1);
        renderHeader();
        document.querySelectorAll("#table-body tr").forEach(tr => {
          const cells = tr.querySelectorAll("td");
          if (cells[idx]) cells[idx].remove();
        });
        updateRowCount();
      }
    });
    document.getElementById("add-col-btn").addEventListener("click", () => {
      columns.push({ name: `Колонка ${columns.length + 1}` });
      renderHeader();
      document.querySelectorAll("#table-body tr").forEach(tr => {
        const td = document.createElement("td");
        td.innerHTML = `<input type="text" name="cell" placeholder="0">`;
        const delTd = tr.querySelector("td:last-child");
        tr.insertBefore(td, delTd);
      });
      updateRowCount();
    });
    document.getElementById("add-row-btn").addEventListener("click", () => { addRow(); updateRowCount(); });
    document.getElementById("table-body").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-del-row]");
      if (btn) { btn.closest("tr").remove(); updateRowCount(); }
    });

    // --- сохранить → tg.sendData → bot.py (web_app_data) ---
    // NOTE: tg.sendData доставляется bot'у ТОЛЬКО через KeyboardButton(web_app) из
    // /start. Menu button "Ёblist" → tg.sendData вызывается, но bot его НЕ получит
    // (Telegram limitation: menu_button требует answerWebAppQuery). PTB 22.6 не
    // парсит web_app_query → только KeyboardButton path.
    // isKeyboardButtonContext: tg.initData пустой в menu_button, но может быть
    // пустым и в KeyboardButton (Telegram bug) → fallback на tg.showPopup инструкцию.
    function isKeyboardButtonContext() {
      try {
        // initDataNonEmpty ИЛИ initDataUnsafe.chat/user есть → значит tg.sendData доставит
        return !!(tg && tg.sendData && (tg.initData?.length > 0 || tg.initDataUnsafe?.chat?.id || tg.initDataUnsafe?.user?.id));
      } catch(e) { return false; }
    }
    document.getElementById("save-btn").addEventListener("click", async () => {
      const rows = [];
      document.querySelectorAll("#table-body tr").forEach(tr => {
        const vals = Array.from(tr.querySelectorAll("input[name='cell']")).map(i => i.value);
        if (vals.some(v => v)) rows.push(vals);
      });
      if (!rows.length) { showToast("Нечего сохранять — добавьте строки"); return; }
      const payload = { action: "add_rows", chat_id: chatId, columns: columns.map(c => c.name), rows: rows };
      if (tg && tg.sendData) {
        if (isKeyboardButtonContext()) {
          // ✅ через KeyboardButton — tg.sendData доставит bot'у
          tg.sendData(JSON.stringify(payload));
          showToast("✅ Отправлено в Telegram!");
        } else {
          // ⚠️ menu_button context: tg.sendData НЕ доставит → инструкция
          showToast("⚠️ Данные не доставлены (menu button). Открываю чат с ботом → /start → кнопка внизу...");
          try { if (tg.openLink) tg.openLink("https://t.me/Eblistbot?start=table"); } catch(e) {}
          try {
            if (tg.showPopup && typeof tg.showPopup === "function") {
              tg.showPopup({ type: "alert", title: "Ёblist", message: "Через меню tg.sendData не работает. Нажмите /start в чате с ботом → кнопка «📋 Ёblist — открыть таблицу» внизу → сохраняйте через 💾 Сохранить в Telegram ✅" });
            }
          } catch(e) {}
        }
      } else {
        // вне Telegram
        showToast("💾 " + rows.length + " строк | " + columns.length + " колонок (fallback: вне Telegram)");
        console.log("[no-tg] payload:", payload);
      }
    });

    // --- очистить строки ---
    document.getElementById("clear-btn").addEventListener("click", () => {
      document.getElementById("table-body").innerHTML = "";
      addRow(); updateRowCount();
      showToast("Строки очищены");
    });

    // --- скачать: через tg.sendData action=download ---
    document.getElementById("download-btn").addEventListener("click", () => {
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: "download", chat_id: chatId }));
        showToast("📥 Запрос файла отправлен боту");
      } else {
        showToast("📥 Нажмите в Telegram для скачивания");
      }
    });

    // --- голос: Web Speech API (macOS Safari/Chrome Desktop) ---
    // iOS/WebKit: SpeechRecognition НЕ поддерживается → fallback на Telegram voice message → whisper
    const voiceBtn = document.getElementById("voice-btn");
    const voiceArea = document.getElementById("voice-area");
    const voiceHint = document.getElementById("voice-hint");
    // isRecording + speechRec объявлены в global scope (line 119-120)

    voiceBtn.addEventListener("click", async () => {
      if (isRecording) {
        try { if (speechRec) speechRec.stop(); } catch(e) {}
        voiceBtn.textContent = "🎙"; voiceBtn.classList.remove("recording");
        voiceArea.classList.remove("recording");
        voiceHint.textContent = "Распознаю...";
        isRecording = false;
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceHint.textContent = "Web Speech API не поддерживается в этом браузере";
        showToast("🚫 Web Speech недоступен");
        return;
      }
      try {
        speechRec = new SpeechRecognition();
        speechRec.lang = "ru-RU";
        speechRec.interimResults = false;
        speechRec.maxAlternatives = 1;
        speechRec.onresult = (e) => {
          const text = e.results[0][0].transcript.trim();
          voiceHint.textContent = `Распознано: «${text}»`;
          showToast("✅ " + text);
          const parts = text.split(",").map(s => s.trim()).filter(Boolean);
          const firstRow = document.querySelector("#table-body tr");
          if (firstRow && parts.length >= 2) {
            const inputs = firstRow.querySelectorAll("input[name='cell']");
            parts.forEach((v, i) => { if (inputs[i]) inputs[i].value = v; });
          }
        };
        speechRec.onerror = (e) => {
          voiceHint.textContent = "Ошибка: " + e.error;
          showToast("❌ " + e.error);
        };
        speechRec.onend = () => {
          voiceBtn.textContent = "🎙"; voiceBtn.classList.remove("recording");
          voiceArea.classList.remove("recording");
          isRecording = false;
          voiceHint.textContent = "Нажми — Web Speech распознаёт → tg.sendData в бот";
        };
        speechRec.start();
        voiceBtn.textContent = "⏹"; voiceBtn.classList.add("recording");
        voiceArea.classList.add("recording");
        voiceHint.textContent = "Слушаю...";
        isRecording = true;
      } catch (err) {
        // macOS Safari / iOS: InvalidStateError (already started) или микрофон недоступен
        voiceHint.textContent = "Web Speech недоступен. Запишите voice message в Telegram — бот распознает через whisper.";
        showToast("🎙 voice → whisper (в чате с ботом)");
        isRecording = false;
      }
    });    // <- ЗАКРЫТИЕ voiceBtn.addEventListener("click", ...)

    // back swipe (iOS-like)
    let startY = 0;
    document.addEventListener("touchstart", (e) => { startY = e.touches[0].clientY; }, { passive: true });
    document.addEventListener("touchend", () => { if (startY > 200 && tg?.close) tg.close(); });

    // init
    renderHeader();
    renderRows();
  </script>
</body>
</html>
